services:
  postgres:
    image: postgres:16-alpine
    container_name: servidos-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: servidos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: