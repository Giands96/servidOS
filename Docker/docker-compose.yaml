services:
  postgres:
    image: postgres:16-alpine
    container_name: servidos-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: servidos
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in the root .env or environment}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env or environment}

    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
