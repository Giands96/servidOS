services:
  postgres:
    image: postgres:16-alpine
    container_name: servidos-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: servidos
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: