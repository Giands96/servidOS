name: servidos-test

services:
  postgres:
    image: postgres:16-alpine
    container_name: servidos-postgres-test
    restart: unless-stopped

    environment:
      POSTGRES_DB: servidos_test
      POSTGRES_USER: ${TEST_DB_USERNAME:-servidos_test}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-servidos_test}

    ports:
      - "127.0.0.1:${TEST_DB_PORT:-5433}:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_test_data: