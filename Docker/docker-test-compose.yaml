services:
  postgres:
    image: postgres:16-alpine
    container_name: servidos-postgres-test
    restart: unless-stopped

    environment:
      POSTGRES_DB: servidos_test
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in the root .env or environment}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env or environment}

    ports:
      - "