spring:
  application:
    name: v1
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
servidos:
  auth:
    secret: ${JWT_SECRET}
    issuer: servidos
    audience: servidos-web
    access-ttl: 10m
    refresh-absolute-ttl: 7d
debug: false

