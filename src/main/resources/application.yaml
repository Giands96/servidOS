spring:
  application:
    name: v1
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Bootstrap del SUPERADMIN de plataforma (V9). Fail-closed: apagado por defecto,
    # sin credenciales de ejemplo. Un perfil debe habilitarlo explícitamente.
    # Ver application-dev.yaml (dev) y application-prod.yaml (prod).
    placeholders:
      adminPlataformaBootstrap: "false"
      adminPlataformaEmail: "sin-configurar@localhost.invalid"
      # Hash BCrypt (strength 10). While bootstrap is "false" este valor nunca se
      # inserta; en prod debe venir de una env var, nunca del repo.
      adminPlataformaPasswordHash: "sin-configurar"
  threads:
    virtual:
      enabled: true
servidos:
  auth:
    secret: ${JWT_SECRET}
    issuer: servidos
    audience: servidos-web
    access-ttl: 10m
    refresh-absolute-ttl: 7d
app:
  security:
    secure-cookie: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
# Swagger fail-closed: apagado por defecto, solo application-dev.yaml lo enciende.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
debug: false

