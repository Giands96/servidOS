spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/servidos}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
  flyway:
    placeholders:
      # Prod: bootstrap APAGADO por defecto. Un SUPERADMIN sembrado con una password
      # del repo es una backdoor en producción. Para el primer despliegue se enciende
      # a mano con BOOTSTRAP_ADMIN_PLATAFORMA_ENABLED=true y un hash de tu elección;
      # como la guarda es NOT EXISTS, si ya existe un SUPERADMIN no se crea nada.
      adminPlataformaBootstrap: "${BOOTSTRAP_ADMIN_PLATAFORMA_ENABLED:false}"
      adminPlataformaEmail: "${BOOTSTRAP_ADMIN_PLATAFORMA_EMAIL:sin-configurar@localhost.invalid}"
      adminPlataformaPasswordHash: "${BOOTSTRAP_ADMIN_PLATAFORMA_HASH:sin-configurar}"

debug: false

# Explícito a propósito: aunque el default ya es false, en prod queda documentado
# que Swagger no existe (los paths responden 404, springdoc no registra handlers).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

servidos:
  auth:
    secret: ${JWT_SECRET}
    issuer: servidos
    audience: servidos-web
    access-ttl: 10m
    refresh-absolute-ttl: 7d
app:
  security:
    secure-cookie: true
  cors:
    # Sin default a propósito: en prod el origen lo manda el deploy.
    # Si falta la env, la app falla al arrancar (fail-fast, igual que JWT_SECRET).
    allowed-origins: ${CORS_ALLOWED_ORIGINS}